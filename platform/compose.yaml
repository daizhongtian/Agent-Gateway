name: agent-gateway-platform

services:
  database:
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codex_platform}
      POSTGRES_USER: ${POSTGRES_USER:-codex_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      # PostgreSQL 18 stores versioned clusters below /var/lib/postgresql.
      - platform-postgres-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-codex_platform}
      DATABASE_USERNAME: ${POSTGRES_USER:-codex_platform}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8088}
      FORWARD_HEADERS_STRATEGY: ${FORWARD_HEADERS_STRATEGY:-framework}
      PUBLIC_HOST_DOMAIN: ${PUBLIC_HOST_DOMAIN:-api.localhost}
      PUBLIC_HOST_URL_TEMPLATE: ${PUBLIC_HOST_URL_TEMPLATE:-http://localhost:8088/h/{slug}/v1}
      RELAY_URL: ${RELAY_URL:-wss://relay.localhost/agent}
      RELAY_ENABLED: ${RELAY_ENABLED:-false}
      RELAY_INTERNAL_SECRET: ${RELAY_INTERNAL_SECRET:-}
      TUNNEL_TOKEN_TTL: ${TUNNEL_TOKEN_TTL:-5m}
      LOCAL_PROXY_ENABLED: ${LOCAL_PROXY_ENABLED:-true}
      LOCAL_GATEWAY_BASE_URL: ${LOCAL_GATEWAY_BASE_URL:-http://host.docker.internal:4310}
      # Java normally blocks callers from setting Host. The localhost preview
      # rewrites Docker's special hostname to the Gateway's loopback Host.
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Djdk.httpclient.allowRestrictedHeaders=host}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-30d}
      PAIRING_CODE_TTL: ${PAIRING_CODE_TTL:-10m}
      MAX_SESSIONS_PER_USER: ${MAX_SESSIONS_PER_USER:-10}
      MAX_DEVICES_PER_USER: ${MAX_DEVICES_PER_USER:-10}
      MAX_HOSTS_PER_USER: ${MAX_HOSTS_PER_USER:-10}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - "host.docker.internal:host-gateway"

  relay:
    build:
      context: ./relay
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 8092
      BACKEND_URL: http://backend:8080
      RELAY_INTERNAL_SECRET: ${RELAY_INTERNAL_SECRET:-}
      RELAY_NODE_ID: ${RELAY_NODE_ID:-relay-primary}
      PUBLIC_HOST_DOMAIN: ${PUBLIC_HOST_DOMAIN:-api.localhost}
      MAX_GLOBAL_STREAMS: ${RELAY_MAX_GLOBAL_STREAMS:-32}
      MAX_AGENT_STREAMS: ${RELAY_MAX_AGENT_STREAMS:-8}
    ports:
      - "127.0.0.1:${RELAY_PORT:-8092}:8092"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 20s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PLATFORM_PORT:-8088}:8080"
    security_opt:
      - no-new-privileges:true

volumes:
  platform-postgres-data:
