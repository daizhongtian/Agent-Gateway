spring:
  datasource:
    url: jdbc:h2:mem:platform;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

platform:
  frontend-origin: http://localhost:5173
  public-host-domain: api.test.local
  relay-url: wss://relay.test.local/agent
  relay-enabled: false
  secure-cookies: false
  legal-consent-required: false
