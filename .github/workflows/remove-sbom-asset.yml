name: Remove obsolete SBOM release asset

on:
  push:
    branches:
      - V1
    paths:
      - ".github/workflows/remove-sbom-asset.yml"

permissions:
  contents: write

jobs:
  remove:
    name: Remove SBOM from v1.0.0
    runs-on: ubuntu-latest
    steps:
      - name: Delete the obsolete release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release delete-asset v1.0.0
          Codex-Control-Center-v1.0.0-sbom.cdx.json
          --repo daizhongtian/codex_sdk
          --yes
