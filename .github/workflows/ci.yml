name: CI

on:
  push:
    branches:
      - main
      - V3
  pull_request:
    branches:
      - main
      - V3

permissions:
  contents: read

env:
  COVERAGE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
  NPM_CONFIG_FETCH_RETRIES: "3"
  NPM_CONFIG_FETCH_RETRY_FACTOR: "2"
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "2000"
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "15000"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-coverage:
    name: Desktop tests and coverage
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: node scripts/install-locked-dependencies.mjs

      - name: Verify third-party notices are current
        shell: pwsh
        run: |
          npm run generate:notices
          git diff --exit-code -- THIRD_PARTY_NOTICES.md

      - name: Validate release configuration and syntax
        run: |
          npm run check:release
          npm run check

      - name: Run desktop coverage gates
        run: npm run test:coverage

      - name: Upload desktop coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-coverage
          path: coverage/desktop
          if-no-files-found: error
          retention-days: 14

  platform-backend:
    name: Platform backend tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Set up Node.js for coverage gate
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Run backend tests and JaCoCo gates
        working-directory: platform/backend
        run: mvn -B verify

      - name: Upload backend coverage and test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: platform-backend-coverage
          path: |
            platform/backend/target/site/jacoco
            platform/backend/target/surefire-reports
          if-no-files-found: error
          retention-days: 14

  platform-frontend:
    name: Platform frontend tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/frontend/package-lock.json

      - name: Install locked frontend dependencies
        run: node scripts/install-locked-dependencies.mjs --frontend-only

      - name: Run frontend coverage gates
        run: npm --prefix platform/frontend run test:coverage

      - name: Run type check and production build
        run: |
          npm --prefix platform/frontend run check
          npm --prefix platform/frontend run build

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: platform-frontend-coverage
          path: platform/frontend/coverage
          if-no-files-found: error
          retention-days: 14

  platform-e2e:
    name: Platform Docker and Chrome E2E
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RELAY_INTERNAL_SECRET: ci-e2e-only-not-for-production-2026
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/frontend/package-lock.json

      - name: Install locked frontend dependencies
        run: node scripts/install-locked-dependencies.mjs --frontend-only

      - name: Build and start the platform stack
        working-directory: platform
        run: docker compose up -d --build --wait

      - name: Run the maintained full-stack browser test
        run: npm --prefix platform/frontend run test:e2e
        env:
          PLATFORM_E2E_URL: http://localhost:8088
          CHROME_PATH: /usr/bin/google-chrome

      - name: Capture platform logs
        if: always()
        working-directory: platform
        run: docker compose logs --no-color > compose.log

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: platform-e2e
          path: |
            platform/frontend/test-results
            platform/compose.log
          if-no-files-found: warn
          retention-days: 14

      - name: Stop the platform stack
        if: always()
        working-directory: platform
        run: docker compose down --volumes

  visual-smoke:
    name: Desktop visual smoke test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: node scripts/install-locked-dependencies.mjs

      - name: Run maintained visual smoke test with Microsoft Edge
        run: npm run test:visual
        env:
          CHROME_PATH: C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe

      - name: Upload visual test screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-smoke-screenshots
          path: artifacts/*.png
          if-no-files-found: ignore
          retention-days: 14
