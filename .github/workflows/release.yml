name: Release Windows app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish unsigned Windows release
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Advisory third-party notice check
        continue-on-error: true
        shell: pwsh
        run: |
          npm run generate:notices
          git diff --exit-code -- THIRD_PARTY_NOTICES.md

      - name: Validate release tag and configuration
        run: npm run check:release

      - name: Check JavaScript syntax
        run: npm run check

      - name: Build unsigned installer and portable app
        run: npm run dist:all

      - name: Advisory packaged app smoke tests
        continue-on-error: true
        run: npm run test:packaged

      - name: Generate SHA-256 checksums
        run: npm run checksums

      - name: Upload workflow artifacts
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Agent-Gateway-${{ github.ref_name }}-Windows
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Attest release provenance
        continue-on-error: true
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
            release/SHA256SUMS.txt

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart("v")
          $files = Get-ChildItem -Path release -File | Where-Object {
            $_.Extension -eq ".exe" -or
            $_.Name -like "*.exe.blockmap" -or
            $_.Name -eq "latest.yml" -or
            $_.Name -eq "SHA256SUMS.txt"
          } | ForEach-Object { $_.FullName }
          if (-not $files) { throw "No release files were found." }
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --verify-tag --generate-notes --title "Agent Gateway $version" --draft
          }
