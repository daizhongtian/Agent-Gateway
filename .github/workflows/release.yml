name: Release Windows app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish unsigned Windows release
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify third-party notices are current
        shell: pwsh
        run: |
          npm run generate:notices
          git diff --exit-code -- THIRD_PARTY_NOTICES.md

      - name: Validate release tag and configuration
        run: npm run check:release

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run backend tests
        run: npm test

      - name: Run visual smoke tests
        run: npm run test:visual

      - name: Build unsigned installer and portable app
        run: npm run dist:all

      - name: Run packaged installer and portable smoke tests
        run: npm run test:packaged

      - name: Generate SHA-256 checksums
        run: npm run checksums

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Agent-Gateway-${{ github.ref_name }}-Windows
          path: |
            release/*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Attest release provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/*.exe
            release/SHA256SUMS.txt

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart("v")
          $files = Get-ChildItem -Path release -File | Where-Object {
            $_.Extension -eq ".exe" -or
            $_.Name -eq "SHA256SUMS.txt"
          } | ForEach-Object { $_.FullName }
          if (-not $files) { throw "No release files were found." }
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --verify-tag --generate-notes --title "Agent Gateway $version"
          }
