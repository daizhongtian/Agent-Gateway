name: Release Windows app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish unsigned Windows release
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Advisory third-party notice check
        continue-on-error: true
        shell: pwsh
        run: |
          npm run generate:notices
          git diff --exit-code -- THIRD_PARTY_NOTICES.md

      - name: Validate release tag and configuration
        run: npm run check:release

      - name: Check JavaScript syntax
        run: npm run check

      - name: Build unsigned installer and portable app
        run: npm run dist:all

      - name: Advisory packaged app smoke tests
        continue-on-error: true
        run: npm run test:packaged

      - name: Generate SHA-256 checksums
        run: npm run checksums

      - name: Upload workflow artifacts
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Agent-Gateway-${{ github.ref_name }}-Windows
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Attest release provenance
        continue-on-error: true
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
            release/SHA256SUMS.txt

      - name: Create or update draft GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart("v")
          $files = Get-ChildItem -Path release -File | Where-Object {
            $_.Extension -eq ".exe" -or
            $_.Name -like "*.exe.blockmap" -or
            $_.Name -eq "latest.yml" -or
            $_.Name -eq "SHA256SUMS.txt"
          } | ForEach-Object { $_.FullName }
          if (-not $files) { throw "No release files were found." }
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --verify-tag --generate-notes --title "Agent Gateway $version" --draft
          }

      - name: Verify assets and publish Latest Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $files = Get-ChildItem -Path release -File | Where-Object {
            $_.Extension -eq ".exe" -or
            $_.Name -like "*.exe.blockmap" -or
            $_.Name -eq "latest.yml" -or
            $_.Name -eq "SHA256SUMS.txt"
          }
          if ($files.Count -ne 5) {
            throw "Expected exactly five release assets, found $($files.Count)."
          }

          $release = gh release view $tag --json assets,isDraft,isPrerelease,tagName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Could not read back draft release $tag." }
          if ($release.tagName -ne $tag) { throw "Release tag readback did not match $tag." }

          $expectedNames = @($files.Name | Sort-Object)
          $actualNames = @($release.assets.name | Sort-Object)
          $assetDifference = Compare-Object -ReferenceObject $expectedNames -DifferenceObject $actualNames
          if ($assetDifference) {
            throw "Uploaded release assets do not match the five locally built assets."
          }
          foreach ($asset in $release.assets) {
            if ($asset.size -le 0) { throw "Release asset $($asset.name) is empty." }
            if ($asset.state -ne "uploaded") { throw "Release asset $($asset.name) is not uploaded." }
          }

          gh release edit $tag --draft=false --prerelease=false --latest
          if ($LASTEXITCODE -ne 0) { throw "Could not publish release $tag." }

          $published = gh release view $tag --json isDraft,isPrerelease,tagName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $published.isDraft -or $published.isPrerelease) {
            throw "Release $tag was not published as a stable release."
          }
          $latestTag = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq .tag_name
          if ($LASTEXITCODE -ne 0 -or $latestTag -ne $tag) {
            throw "Release $tag is not the repository's Latest Release."
          }
