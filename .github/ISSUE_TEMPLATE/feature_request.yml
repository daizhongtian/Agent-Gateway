name: Feature request
description: Propose a focused improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Explain the user problem before the proposed implementation. This is an independent community project and cannot change OpenAI/Codex account entitlements or service behavior.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who has this problem, and what workflow is blocked?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful change and its user-visible result.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Desktop UI
        - Gateway/API
        - Attachments
        - Environment detection
        - Installer/update
        - Security/privacy
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and privacy impact
      description: Note any API, on-disk format, network, credential, permission, retention, or migration impact.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and pull requests.
          required: true
        - label: This request does not contain secrets or private user data.
          required: true
