name: Bug report
description: Report a reproducible problem in Codex Control Center
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. This is an independent community project, not an OpenAI support channel.
        **Do not include Gateway keys, OpenAI keys, cookies, credentials, private prompts/files/results, or unredacted local paths.** Report security vulnerabilities privately according to SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Application version
      description: Version shown in the application/About view or GitHub Release name.
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: edition
    attributes:
      label: Edition
      options:
        - Windows installer
        - Windows portable
        - npm development mode
        - Standalone HTTP server
        - Docker
        - Other/unknown
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Windows/Node/Docker version and architecture; redact user names and private paths.
      placeholder: Windows 11 24H2, x64
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: State the observed behavior and expected behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Start ...
        2. Choose ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Paste only relevant environment-check results, error codes, or logs after removing secrets, prompts, content, and personal paths.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I tested the latest release or current main branch.
          required: true
        - label: I removed all credentials, private content, and identifying paths.
          required: true
        - label: This is not a security vulnerability requiring private disclosure.
          required: true
